name: Backend CI/CD — develop & main

# Trigger khi push hoặc PR vào nhánh develop hoặc main,
# VÀ chỉ khi có thay đổi bên trong thư mục Backend/
on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Backend/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Backend/**'

# Chỉ cho phép 1 run cùng lúc trên nhánh develop (hủy run cũ nếu có run mới)
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Build & Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/SteelBikeRunBackend

    steps:
      - name: ⬇Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Inject các secrets vào application.properties trước khi build
      - name: Inject application.properties từ secrets
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.properties << 'EOF'
          spring.application.name=SteelBikeRunBackend
          server.port=8081

          # JWT
          app.jwt.secret=${{ secrets.JWT_SECRET }}
          app.jwt.expiration-ms=${{ secrets.JWT_EXPIRATION_MS }}

          # Datasource — Neon PostgreSQL
          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.username=${{ secrets.DB_USERNAME }}
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          spring.datasource.driver-class-name=org.postgresql.Driver

          # HikariCP
          spring.datasource.hikari.maximum-pool-size=5
          spring.datasource.hikari.minimum-idle=2
          spring.datasource.hikari.connection-timeout=30000
          spring.datasource.hikari.idle-timeout=600000
          spring.datasource.hikari.max-lifetime=1800000
          spring.datasource.hikari.keepalive-time=60000

          # JPA / Hibernate
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.properties.hibernate.jdbc.time_zone=UTC

          # SpringDoc / Swagger
          springdoc.swagger-ui.path=/swagger-ui.html
          springdoc.swagger-ui.tags-sorter=alpha
          springdoc.swagger-ui.operations-sorter=alpha
          springdoc.swagger-ui.display-request-duration=true
          springdoc.api-docs.path=/v3/api-docs
          springdoc.paths-to-exclude=/app/**,/topic/**

          # Flyway
          spring.flyway.baseline-on-migrate=true

          # Redis
          spring.data.redis.host=${{ secrets.REDIS_HOST }}
          spring.data.redis.port=${{ secrets.REDIS_PORT }}
          spring.data.redis.password=${{ secrets.REDIS_PASSWORD }}
          spring.data.redis.username=default
          spring.data.redis.connect-timeout=5000
          spring.data.redis.timeout=3000
          app.cache.profile-ttl-minutes=10
          EOF

      - name: Build with Maven (skip tests)
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Run Unit Tests
        run: mvn -B test --no-transfer-progress

      # Lưu artifact JAR để dùng ở các job tiếp theo
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Backend/SteelBikeRunBackend/target/*.jar
          retention-days: 7

  # JOB 2: Code Quality (chạy song song với build-and-test)
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build-and-test

    defaults:
      run:
        working-directory: Backend/SteelBikeRunBackend

    steps:
      - name: ⬇Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Inject application.properties từ secrets
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.properties << 'EOF'
          spring.application.name=SteelBikeRunBackend
          server.port=8081
          app.jwt.secret=${{ secrets.JWT_SECRET }}
          app.jwt.expiration-ms=${{ secrets.JWT_EXPIRATION_MS }}
          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.username=${{ secrets.DB_USERNAME }}
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          spring.datasource.driver-class-name=org.postgresql.Driver
          spring.datasource.hikari.maximum-pool-size=5
          spring.datasource.hikari.minimum-idle=2
          spring.datasource.hikari.connection-timeout=30000
          spring.datasource.hikari.idle-timeout=600000
          spring.datasource.hikari.max-lifetime=1800000
          spring.datasource.hikari.keepalive-time=60000
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.properties.hibernate.jdbc.time_zone=UTC
          springdoc.swagger-ui.path=/swagger-ui.html
          springdoc.api-docs.path=/v3/api-docs
          spring.flyway.baseline-on-migrate=true
          spring.data.redis.host=${{ secrets.REDIS_HOST }}
          spring.data.redis.port=${{ secrets.REDIS_PORT }}
          spring.data.redis.password=${{ secrets.REDIS_PASSWORD }}
          spring.data.redis.username=default
          app.cache.profile-ttl-minutes=10
          EOF

      # Kiểm tra compile warnings & potential issues
      - name: Verify Maven build (compile + verify lifecycle)
        run: mvn -B verify -DskipTests --no-transfer-progress

  # JOB 3: Docker Build & Push (CHỈ chạy khi push vào main)
  docker-build-push:
    name: Docker Build & Push to Hub
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    # Chỉ chạy khi push thẳng vào main (không chạy với PR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: ⬇ Checkout source
        uses: actions/checkout@v4

      # Tạo lại application.properties chứa biến môi trường bên trong Docker image
      - name: Inject application.properties cho Docker build
        run: |
          mkdir -p Backend/SteelBikeRunBackend/src/main/resources
          cat > Backend/SteelBikeRunBackend/src/main/resources/application.properties << 'EOF'
          spring.application.name=SteelBikeRunBackend
          server.port=8081
          app.jwt.secret=${{ secrets.JWT_SECRET }}
          app.jwt.expiration-ms=${{ secrets.JWT_EXPIRATION_MS }}
          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.username=${{ secrets.DB_USERNAME }}
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          spring.datasource.driver-class-name=org.postgresql.Driver
          spring.datasource.hikari.maximum-pool-size=5
          spring.datasource.hikari.minimum-idle=2
          spring.datasource.hikari.connection-timeout=30000
          spring.datasource.hikari.idle-timeout=600000
          spring.datasource.hikari.max-lifetime=1800000
          spring.datasource.hikari.keepalive-time=60000
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.properties.hibernate.jdbc.time_zone=UTC
          springdoc.swagger-ui.path=/swagger-ui.html
          springdoc.swagger-ui.tags-sorter=alpha
          springdoc.swagger-ui.operations-sorter=alpha
          springdoc.swagger-ui.display-request-duration=true
          springdoc.api-docs.path=/v3/api-docs
          springdoc.paths-to-exclude=/app/**,/topic/**
          spring.flyway.baseline-on-migrate=true
          spring.data.redis.host=${{ secrets.REDIS_HOST }}
          spring.data.redis.port=${{ secrets.REDIS_PORT }}
          spring.data.redis.password=${{ secrets.REDIS_PASSWORD }}
          spring.data.redis.username=default
          spring.data.redis.connect-timeout=5000
          spring.data.redis.timeout=3000
          app.cache.profile-ttl-minutes=10
          EOF

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tạo metadata (tag) cho Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/steel-bike-run-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & Push Docker image lên Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: Backend/SteelBikeRunBackend
          file: Backend/SteelBikeRunBackend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # JOB 4: Deploy lên AWS EC2 (CHỈ chạy khi push vào main)
  deploy-to-ec2:
    name: Deploy lên AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: SSH vào EC2 và deploy bản mới
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Đăng nhập Docker Hub trên EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Kéo image mới nhất về EC2
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/steel-bike-run-backend:latest

            # Dừng và xóa container cũ (nếu đang chạy)
            docker stop steel-bike-backend || true
            docker rm steel-bike-backend || true

            # Chạy container mới với cổng 8081
            docker run -d \
              --name steel-bike-backend \
              --restart unless-stopped \
              -p 8081:8081 \
              ${{ secrets.DOCKERHUB_USERNAME }}/steel-bike-run-backend:latest

            # Dọn dẹp image cũ không dùng nữa để tiết kiệm ổ đĩa
            docker image prune -f

            echo "Deploy thành công! Container đang chạy."

  # JOB 5: Thông báo kết quả cuối
  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: always()

    steps:
      - name: Pipeline thành công
        if: ${{ needs.build-and-test.result == 'success' && needs.code-quality.result == 'success' }}
        run: |
          echo "============================================"
          echo "  Backend CI pipeline PASSED!"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "============================================"

      - name: Pipeline thất bại
        if: ${{ needs.build-and-test.result == 'failure' || needs.code-quality.result == 'failure' }}
        run: |
          echo "============================================"
          echo "  Backend CI pipeline FAILED!"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "============================================"
          exit 1
