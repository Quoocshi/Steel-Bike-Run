name: Backend CI/CD — develop

# ============================================================
# Chỉ trigger khi push/PR vào nhánh develop,
# VÀ chỉ khi có thay đổi bên trong thư mục Backend/
# ============================================================
on:
  push:
    branches:
      - develop
    paths:
      - 'Backend/**'
  pull_request:
    branches:
      - develop
    paths:
      - 'Backend/**'

# Chỉ cho phép 1 run cùng lúc trên nhánh develop (hủy run cũ nếu có run mới)
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Build & Test
  # ============================================================
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/SteelBikeRunBackend

    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Inject các secrets vào application.properties trước khi build
      - name: 🔐 Inject application.properties từ secrets
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.properties << 'EOF'
          spring.application.name=SteelBikeRunBackend
          server.port=8081

          # JWT
          app.jwt.secret=${{ secrets.JWT_SECRET }}
          app.jwt.expiration-ms=${{ secrets.JWT_EXPIRATION_MS }}

          # Datasource — Neon PostgreSQL
          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.username=${{ secrets.DB_USERNAME }}
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          spring.datasource.driver-class-name=org.postgresql.Driver

          # HikariCP
          spring.datasource.hikari.maximum-pool-size=5
          spring.datasource.hikari.minimum-idle=2
          spring.datasource.hikari.connection-timeout=30000
          spring.datasource.hikari.idle-timeout=600000
          spring.datasource.hikari.max-lifetime=1800000
          spring.datasource.hikari.keepalive-time=60000

          # JPA / Hibernate
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.properties.hibernate.jdbc.time_zone=UTC

          # SpringDoc / Swagger
          springdoc.swagger-ui.path=/swagger-ui.html
          springdoc.swagger-ui.tags-sorter=alpha
          springdoc.swagger-ui.operations-sorter=alpha
          springdoc.swagger-ui.display-request-duration=true
          springdoc.api-docs.path=/v3/api-docs
          springdoc.paths-to-exclude=/app/**,/topic/**

          # Flyway
          spring.flyway.baseline-on-migrate=true
          EOF

      - name: 🏗️ Build với Maven (skip tests ở bước này)
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: 🧪 Chạy Unit Tests
        run: mvn -B test --no-transfer-progress

      # Lưu artifact JAR để dùng ở các job tiếp theo
      - name: 📦 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Backend/SteelBikeRunBackend/target/*.jar
          retention-days: 7

  # ============================================================
  # JOB 2: Code Quality (chạy song song với build-and-test)
  # ============================================================
  code-quality:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    needs: build-and-test

    defaults:
      run:
        working-directory: Backend/SteelBikeRunBackend

    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🔐 Inject application.properties từ secrets
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.properties << 'EOF'
          spring.application.name=SteelBikeRunBackend
          server.port=8081
          app.jwt.secret=${{ secrets.JWT_SECRET }}
          app.jwt.expiration-ms=${{ secrets.JWT_EXPIRATION_MS }}
          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.username=${{ secrets.DB_USERNAME }}
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          spring.datasource.driver-class-name=org.postgresql.Driver
          spring.datasource.hikari.maximum-pool-size=5
          spring.datasource.hikari.minimum-idle=2
          spring.datasource.hikari.connection-timeout=30000
          spring.datasource.hikari.idle-timeout=600000
          spring.datasource.hikari.max-lifetime=1800000
          spring.datasource.hikari.keepalive-time=60000
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.properties.hibernate.jdbc.time_zone=UTC
          springdoc.swagger-ui.path=/swagger-ui.html
          springdoc.api-docs.path=/v3/api-docs
          spring.flyway.baseline-on-migrate=true
          EOF

      # Kiểm tra compile warnings & potential issues (checkstyle tùy chọn)
      - name: 📋 Verify Maven build (compile + verify lifecycle)
        run: mvn -B verify -DskipTests --no-transfer-progress

  # ============================================================
  # JOB 3: Notify kết quả (chạy dù success hay failure)
  # ============================================================
  notify:
    name: 📣 Notify Result
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: always()

    steps:
      - name: ✅ Pipeline thành công
        if: ${{ needs.build-and-test.result == 'success' && needs.code-quality.result == 'success' }}
        run: |
          echo "============================================"
          echo "  ✅ Backend CI pipeline PASSED!"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "============================================"

      - name: ❌ Pipeline thất bại
        if: ${{ needs.build-and-test.result == 'failure' || needs.code-quality.result == 'failure' }}
        run: |
          echo "============================================"
          echo "  ❌ Backend CI pipeline FAILED!"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "============================================"
          exit 1
